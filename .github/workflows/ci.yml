name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev python3
      - name: Build with hardening flags
        run: |
          CFLAGS="-O2 -Wall -Wextra -D_FORTIFY_SOURCE=2 -fstack-protector-strong" \
              ./configure
          make
      - name: Smoke test
        run: src/ytalk -v
      - name: Terminal emulation under ASan/UBSan
        run: tests/run.sh
